<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答卷记录 · 社区宠物到家</title><link rel="stylesheet" href="style.css?v=0.4-online"><script type="module" src="records.js?v=0.4-online"></script></head><body>
<header class="hero"><div class="wrap"><div class="eyebrow">多人独立提交 · 答卷集中留档</div><h1>运营业务流程答卷记录</h1><p>按平台与填写人查看回收、修订和已答题数。每次有效提交单独保留。</p><a class="light-link" href="index.html">← 返回填写问卷</a></div></header><main class="wrap">
<section class="intro"><p>本页为公开需求记录。默认不计联调测试，同一平台和填写人的多份答卷作为修订记录分别保留，汇总显示最近一份。</p><div class="identity-grid"><label>平台公司/团队筛选<input id="filter-company" placeholder="输入平台名称"></label><label>填写人筛选<input id="filter-name" placeholder="输入姓名或称呼"></label><label class="option"><input type="checkbox" id="include-tests">包含联调测试</label></div><button id="refresh" type="button" class="secondary">刷新记录</button><button id="export-csv" type="button" class="primary" disabled>导出当前筛选 CSV</button><p id="records-status" role="status" aria-live="polite">正在加载…</p></section>
<section class="intro"><h2>回收概况</h2><p id="totals">尚未加载</p><div class="table-scroll"><table><thead><tr><th>平台</th><th>填写人</th><th>提交份数</th><th>最近提交</th><th>最近已答</th></tr></thead><tbody id="summary-body"></tbody></table></div></section>
<section class="intro"><h2>全部提交记录</h2><div class="table-scroll"><table><thead><tr><th>记录号</th><th>平台 / 填写人</th><th>时间</th><th>已答</th><th>答卷</th></tr></thead><tbody id="records-body"></tbody></table></div></section><section class="intro" id="answer-detail" hidden></section></main></body></html>
