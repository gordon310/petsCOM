<body>
<header class="toolbar"><div class="brand"><div class="mark">🐾</div><div><strong>社区宠物到家</strong><small>两个社区试点 · 交互需求原型 V0.1</small></div></div><div class="roles" id="roles"><button class="role active" data-action="role" data-role="resident">👤 居民端</button><button class="role" data-action="role" data-role="station">🏠 社区接待端</button><button class="role" data-action="role" data-role="worker">🦺 上门人员端</button><button class="role" data-action="role" data-role="admin">🗂️ 总部后台</button></div><span class="tag">仅供业务确认 · 不连接真实系统</span></header>
<main class="canvas"><div class="workspace"><div class="workspace-top"><span>可点击演示界面 · 页面与价格均待确认</span><span class="work-badge" id="rolebadge">居民端</span></div><div id="stage"></div></div><aside class="sidepanel"><section class="panel"><span class="context">需求审查 · 第 0 轮</span><h3 id="guide-title">居民预约</h3><p id="guide-intro"></p><div class="space14"></div><div class="guideline" id="guide-tasks"></div></section><section class="panel"><h3>当前未确认的业务规则</h3><ul><li>两个社区名称、开放区域与服务范围</li><li>项目收费标准、退款政策及支付方式</li><li>接待站是否参与钥匙及宠物交接</li><li>上门服务人员来源与安全责任</li><li>综合体业务是否需要系统对接</li></ul><div class="space14"></div><div class="attention">先回收《需求确认问卷》，评审通过后才出 UI V1.0 确认稿和开发任务。</div></section></aside></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const serviceNames=['上门喂猫','上门遛狗','上门照看','洗护预约','诊所预约','酒店寄养','训犬预约'];
const homeServices=[{name:'上门喂猫',icon:'🐱',note:'喂食 · 换水 · 清洁'},{name:'上门遛狗',icon:'🐕',note:'遛狗 · 基础陪伴'},{name:'上门照看',icon:'🏡',note:'项目待确认'},{name:'宠物接送',icon:'🚗',note:'项目待确认'}];
const referrals=[{name:'洗护预约',icon:'🛁',note:'预约现有洗护服务'},{name:'诊所预约',icon:'🏥',note:'诊疗预约及转介'},{name:'酒店寄养',icon:'🛏️',note:'寄养服务咨询'},{name:'训犬预约',icon:'🎾',note:'训犬课程咨询'}];
const s={role:'resident',pages:{resident:'home',station:'desk',worker:'tasks',admin:'overview'},community:'社区 A（示例）',service:'上门喂猫',pet:'奶糖 · 猫',date:'',time:'上午（具体时间待定）',address:'',entry:'主人或家人在场',note:'',consent:false,bookingStep:1,selectedOrder:'DEMO-1001',workerChecks:{food:false,water:false,clean:false,photo:false},incidents:[],referrals:[],assistedName:'',assistedConsent:false,assistedService:'上门喂猫',assistedTime:'',assistedPet:'',referralService:'洗护预约',referralContact:'',orders:[
{id:'DEMO-1001',site:'社区 A（示例）',service:'上门喂猫',pet:'奶糖 · 猫',date:'待约定',time:'上午',address:'仅演示，未填写真实地址',status:'待派单',source:'居民自助',worker:'',note:'无',report:false},
{id:'DEMO-1002',site:'社区 B（示例）',service:'上门遛狗',pet:'豆豆 · 狗',date:'待约定',time:'下午',address:'仅演示，未填写真实地址',status:'已派单',source:'居民自助',worker:'示例服务员 1',note:'无',report:false}
]};

function phone(title,body,navigation){return `<div class="phone"><div class="phone-top"><span>09:41</span><span>●●●　▰</span></div><div class="phone-head"><b>${title}</b><button class="head-btn" data-action="home-role">${s.role==='worker'?'我的任务':s.role==='station'?'工作台':'社区服务'} ◀</button></div><section class="phone-content">${body}</section>${navigation||''}</div>`;}

const stationNav=()=>nav([['今日','▦','desk'],['代预约','＋','assist'],['本站订单','▤','stationOrders'],['转介','↗','stationReferral']]);

function resident(){const page=s.pages.resident;let body='';let title='社区宠物到家';
if(page==='home'){

`<div class="info-card"><div class="emoji-square">🏠</div><div><b>${E(s.community)}服务接待站</b><p>现场咨询、协助预约和订单查询<br>实际营业时间与地点待确认</p><button class="link" data-action="contact">查看接待方式 →</button></div></div>`;
}

if(page==='sites'){content=`<h1 class="admin-h1">社区与接待站管理</h1><p class="admin-intro">两个社区的名称、免费场地条件、责任及岗位安排，都必须在签约后配置。</p><div class="admin-grid">${['A','B'].map(x=>`<div class="admin-section"><h3>🏠 社区 ${x}（示例）</h3><div class="divider"></div><div class="keyval"><span>场地费用</span><strong>免费（口径待核实）</strong></div><div class="keyval"><span>详细地址</span><strong>待确认</strong></div><div class="keyval"><span>值班人员</span><strong>待确认</strong></div><div class="keyval"><span>营业时间</span><strong>待确认</strong></div><div class="keyval"><span>订单数量</span><strong>${count(o=>o.site.includes(x))}</strong></div></div>`).join('')}</div><div class="noticebar">接待员默认仅有本站数据权限；社区合作方仅提供经营汇总报表。</div>`;}
if(page==='people'){content=`<h1 class="admin-h1">人员与岗位配置</h1><p class="admin-intro">再就业接待岗位和实际入户服务岗位分离，是建议的第一阶段风控边界。</p><div class="admin-section"><table class="table"><thead><tr><th>岗位</th><th>示例人员/名额</th><th>是否入户</th><th>雇佣关系</th></tr></thead><tbody><tr><td>社区 A 接待</td><td>待招聘</td><td>默认否</td><td>待确认</td></tr><tr><td>社区 B 接待</td><td>待招聘</td><td>默认否</td><td>待确认</td></tr><tr><td>宠托师</td><td>示例服务员 1</td><td>须经过培训</td><td>待确认</td></tr><tr><td>总部调度/客服</td><td>待确认</td><td>否</td><td>待确认</td></tr></tbody></table></div>`;}
if(page==='pricing'){content=`<h1 class="admin-h1">服务目录与定价</h1><p class="admin-intro">正式价格不能从竞品直接复制。需根据交通、人工、物料、退款及保险评估。</p><div class="admin-section"><table class="table"><thead><tr><th>服务</th><th>交付类型</th><th>定价方式</th><th>价格</th></tr></thead><tbody>${[...homeServices.map(x=>[x.name,'上门履约']),...referrals.map(x=>[x.name,'综合体转介'])].map(([name,type])=>`<tr><td>${E(name)}</td><td>${type}</td><td>待确认</td><td>未配置</td></tr>`).join('')}</tbody></table></div><div class="noticebar">后续可以按社区、额外宠物、节假日、紧急加单、交通距离设置规则。本版没有实际交易。</div>`;}
if(page==='quality'){content=`<h1 class="admin-h1">履约质量与综合体转介</h1><p class="admin-intro">服务报告与专业诊所/洗护/酒店业务并存，统计两类转化。</p><div class="admin-cardrow"><div class="admin-stat"><span>完成报告</span><strong>${count(o=>o.report)}</strong></div><div class="admin-stat"><span>转介意向</span><strong>${s.referrals.length}</strong></div><div class="admin-stat"><span>异常记录</span><strong>${s.incidents.length}</strong></div></div><div class="admin-grid"><div class="admin-section"><h3>服务异常</h3><div class="space14"></div>${s.incidents.map(i=>`<p class="small">⚠️ ${E(i.type)} · ${E(i.order)}</p>`).join('')||'<p class="small muted">无演示异常记录</p>'}</div><div class="admin-section"><h3>综合体服务转介</h3><div class="space14"></div>${s.referrals.map(r=>`<p class="small">↗ ${E(r.service)} · ${E(r.site)} · ${E(r.contact||'演示居民')}</p>`).join('')||'<p class="small muted">暂无转介意向</p>'}</div></div>`;}
return `<div class="admin-stage"><div class="admin-head"><div><strong>🐾 社区宠物到家 · 运营管理</strong><div class="xs muted" style="margin-top:4px">总部统一管理｜演示环境</div></div><span class="pill">模拟数据</span></div><div class="admin-body"><nav class="admin-sidebar">${adminMenu.map(([id,name])=>`<button class="${page===id?'active':''}" data-action="admin-nav" data-page="${id}">${name}</button>`).join('')}</nav><section class="admin-main">${content}</section></div></div>`;}
const guides={resident:['居民自助预约','优先理解居民的预约与服务体验。社区名称必须贯穿整个订单，方便按站点统计和线下服务。','走查路径：社区首页 → 上门喂猫 → 宠物与预约 → 确认 → 我的订单；另外测试综合体的洗护/诊所转介。'],station:['社区接待人员工作台','社区再就业岗位首先负责接待、协助下单、信息记录和转介；不默认承担专业医疗、钥匙保管和独立派单。','走查路径：今日待办 → 辅助下单（居民授权）→ 本站订单；另一条路径是综合体预约意向转介。'],worker:['宠托师履约端','服务人员只看到被指派任务；服务报告、入户授权和异常升级是安全履约基础。','走查路径：总部派单 → 我的任务 → 模拟到达 → 服务清单 → 报告；也请点击“异常上报”。'],admin:['总部统一运营后台','两个社区可独立统计，但服务目录、价格、人员权限、重大投诉和派单由总部统一管理。','走查路径：订单派单 → 切换上门人员端执行 → 回后台查看完成与异常；检查两社区来源字段。']};
function render(){el('roles').querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===s.role));el('rolebadge').textContent={resident:'居民端',station:'社区接待端',worker:'上门服务端',admin:'总部后台'}[s.role];let view={resident,station,worker,admin}[s.role]();el('stage').innerHTML=view;el('stage').className=s.role==='admin'?'admin-view':'';el('stage').style.cssText=s.role==='admin'?'align-self:stretch;width:100%':'display:flex;justify-content:center;width:100%';let g=guides[s.role];el('guide-title').textContent=g[0];el('guide-intro').textContent=g[1];el('guide-tasks').textContent=g[2];}
let toastTimeout;function toast(text){let t=el('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),3400);}
function go(role,page){s.role=role;s.pages[role]=page;render();}
function selectedOrder(id){s.selectedOrder=id;s.workerChecks={food:false,water:false,clean:false,photo:false};}
function handle(a,ds){switch(a){
case 'role':s.role=ds.role;render();break;
case 'nav':s.pages[s.role]=ds.page;render();break;
case 'home-role':go(s.role,{resident:'home',station:'desk',worker:'tasks',admin:'overview'}[s.role]);break;
case 'go-home':go('resident','home');break;
case 'go-orders':go('resident','orders');break;
case 'start-book':s.bookingStep=1;go('resident','booking');break;
case 'choose-service':s.service=ds.service;s.bookingStep=1;go('resident','booking');break;
case 'choose-referral':s.referralService=ds.service;go('resident','referral');break;
case 'next-book':if(s.bookingStep<3){s.bookingStep++;render();}break;
case 'prev-book':if(s.bookingStep>1){s.bookingStep--;render();}break;
case 'submit-book':if(!s.consent){toast('请先确认演示条款（正式条款待运营方审核）');break;}s.orders.unshift({id:'DEMO-'+(1003+s.orders.length),site:s.community,service:s.service,pet:s.pet,date:s.date||'待约定',time:s.time,address:'仅演示，未采集真实地址',status:'待派单',source:'居民自助',worker:'',note:s.note||'无',report:false});s.consent=false;go('resident','orders');toast('模拟预约成功：订单进入总部待派单队列');break;
case 'resident-detail':selectedOrder(ds.id);go('resident','orderDetail');break;
case 'submit-referral':s.referrals.push({service:s.referralService,site:s.community,contact:s.referralContact,source:'居民自助'});go('resident','home');toast('已创建模拟转介意向，请到总部查看');break;
case 'contact':go('resident','stationContact');break;
case 'station-assist':go('station','assist');break;
case 'station-orders':go('station','stationOrders');break;
case 'station-referral':go('station','stationReferral');break;
case 'station-detail':selectedOrder(ds.id);go('station','stationDetail');break;
case 'station-escalate':toast('已模拟记录总部协助请求（无实际通知）');break;
case 'submit-assisted':if(!s.assistedConsent){toast('必须由居民本人确认代预约授权');break;}if(!s.assistedName.trim()){toast('请填写演示居民称呼');break;}s.orders.unshift({id:'DEMO-'+(1003+s.orders.length),site:'社区 A（示例）',service:s.assistedService,pet:s.assistedPet||'待确认',date:s.assistedTime||'待约定',time:'',address:'未采集真实地址',status:'待派单',source:'社区接待',worker:'',note:'需要居民确认正式费用及入户授权',report:false});s.assistedConsent=false;go('station','stationOrders');toast('代约演示单已提交总部待派单');break;
case 'submit-station-referral':s.referrals.push({service:s.referralService,site:'社区 A（示例）',contact:s.referralContact,source:'社区接待'});render();toast('转介意向已生成（模拟）');break;
case 'worker-detail':selectedOrder(ds.id);go('worker','taskDetail');break;
case 'worker-tasks':go('worker','tasks');break;
case 'start-work':{let o=s.orders.find(o=>o.id===s.selectedOrder&&o.worker==='示例服务员 1');if(o){o.status='服务中';go('worker','execution');toast('已模拟到场签到');}break;}
case 'finish-work':{let o=s.orders.find(o=>o.id===s.selectedOrder&&o.worker==='示例服务员 1');if(!o){toast('请先选择任务');break;}if(Object.values(s.workerChecks).some(v=>!v)){toast('请先勾选所有示例服务检查项');break;}o.status='已完成';o.report=true;go('worker','taskDetail');toast('服务报告已提交（模拟）');break;}
case 'go-incident':go('worker','incident');break;
case 'raise-incident':s.incidents.push({type:ds.incident,order:s.selectedOrder});go('worker','tasks');toast('异常已加入总部待处理列表（模拟，无实际通知）');break;
case 'admin-nav':s.pages.admin=ds.page;render();break;
case 'admin-orders':go('admin','orders');break;
case 'assign':{let o=s.orders.find(o=>o.id===ds.id);if(o&&o.status==='待派单'){o.worker='示例服务员 1';o.status='已派单';render();toast('已模拟派单。切换到上门人员端查看。');}break;}
default:toast('此功能需问卷确认后设计');}}
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b||b.disabled)return;handle(b.dataset.action,b.dataset);});
document.addEventListener('change',ev=>{let f=ev.target.dataset.field;if(f&&Object.prototype.hasOwnProperty.call(s,f)){s[f]=ev.target.type==='checkbox'?ev.target.checked:ev.target.value;if(['community','service'].includes(f)&&s.pages.resident==='home')render();}let c=ev.target.dataset.check;if(c!==undefined)s.workerChecks[c]=ev.target.checked;});
document.addEventListener('input',ev=>{let f=ev.target.dataset.field;if(f&&ev.target.tagName!=='SELECT'&&ev.target.type!=='checkbox')s[f]=ev.target.value;});
render();
})();
</script>
</body></html>
